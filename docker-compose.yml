version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pollrooms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pollrooms
      POSTGRES_PASSWORD: pollrooms
      POSTGRES_DB: pollrooms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pollrooms -d pollrooms"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: pollrooms-pgadmin
    restart: unless-stopped
    profiles: ["admin"]
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
